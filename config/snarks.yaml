# basic settings
task_name: bigbench # bigbench | ncbi | ... | or your own task
search_algo: grace
print_log: true
log_dir: ./logs/base-ds_opt-ds/

# your initial prompt
init_prompt: |
  Determine which of two sentences is sarcastic.

task_setting:
  train_size: 82
  eval_size: 45 # data split for reward calculation
  test_size: 95 # if test_size is not 0, the optimized nodes will be tested at last.
  seed: 42 # if need to fixed shuffled dataset
  data_dir: ./datasets/snarks.json # if data is downloaded
  # Note: the current supported bigbench tasks are specified by 
  # data_dir using the same task_name (bigbench), if there is not
  # specific .py class inplemented in the tasks folder.
  post_instruction: false # false: prompt + task question | true: task question + prompt

base_model_setting:
  model_type: openai # openai
  model_name: deepseek/deepseek-v4-flash # modelo no OpenRouter (vai no corpo da requisicao)
  base_url: https://openrouter.ai/api/v1 # OpenRouter: base fixa, sem slug
  model_url_slug: "" # vazio = nao anexa slug a base_url
  provider_sort: price
  provider_ignore:  # provedores do OpenRouter a ignorar
  max_tokens: 20000 # price | throughput | latency# api-based model'name or huggingface model nam
  temperature: 0.7
  api_key: #api key do OpenRouter (ou OpenAI) para o modelo base. Se estiver vazio, o GRACE vai usar o modelo base do OpenAI (gpt-4 ou gpt-3.5-turbo) com a api_key do OpenAI.
  base_model: true

optim_model_setting:
  model_type: openai # openai
  model_name: deepseek/deepseek-v4-flash # modelo no OpenRouter (vai no corpo da requisicao)
  base_url: https://openrouter.ai/api/v1 # OpenRouter: base fixa, sem slug
  model_url_slug: "" # vazio = nao anexa slug a base_url
  max_tokens: 20000 # price | throughput | latency# api-based model'name or huggingface model nam
  provider_sort: price # price | throughput | latency# api-based model'name or huggingface model nam
  provider_ignore:  # provedores do OpenRouter a ignorar
  api_key: #api key do OpenRouter (ou OpenAI) para o modelo otimizado. Se estiver vazio, o GRACE vai usar o modelo otimizado do OpenAI (gpt-4 ou gpt-3.5-turbo) com a api_key do OpenAI.  
  temperature: 0.9
  base_model: false


world_model_setting:
  iteration_num: 80
  stop_early_thresh: 5
  num_correct_sample: 3
  num_wrong_sample: 3
  num_new_prompts: 1
  train_shuffle: true
  eval_temperature: 0.0 # temperatura nas chamadas de pontuacao (eval/test); 0.0 = deterministico

  # --- curriculum (os padrões abaixo preservam o comportamento atual) ---
  curriculum_mode: static        # static (atual) | bayes | off (GRACE original)
  # As chaves abaixo só têm efeito com curriculum_mode: bayes
  centroid_mode: global          # global | class (grupo = classe do rótulo)
  intrinsic_mode: centroid       # centroid | hdbscan (requer scikit-learn >= 1.3)
  curriculum_window: 10          # W: janela deslizante de observações por exemplo
  curriculum_prior_strength: 2.0 # kappa: peso do prior em pseudo-observações
  curriculum_refit_every: 5      # R: reajuste empirical Bayes de (w0, w1) a cada R lotes
  curriculum_seed: 0             # seed do sorteio do lote de atualização
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 3
  typical_percentile: 50.0       # percentil (0-100) que define exemplos típicos
  min_group_size: 10             # grupos menores usam o conjunto inteiro / fallback
  regression_threshold: 2.0      # r acima disso prioriza exemplos regredidos
  regression_min_T: 3            # |T| mínimo para o teste de regressão
  regression_easy_threshold: 0.80 # p_hat mínimo para entrar em T (teste acumulado por
                                  # incumbente); separado do easy_threshold 0.85 dos tiers

  # --- aceitação por evidência "Lose to Win" (ver docs/lose_to_win.md) ---
  # Os valores abaixo são os padrões: preservam o comportamento atual.
  acceptance_mode: evidence_shadow # strict (atual) | evidence_shadow (decide como hoje, só registra
                                 # a decisão hipotética) | evidence (regra sequencial de verdade)
  evidence_margin: 1             # m: aceita sse Delta >= m (m=1 equivale a acc > max_acc)
  evidence_delta: 0.05           # rejeita cedo se P(Delta_total >= m) <= delta; completa se >= 1-delta
  evidence_kappa: 5.0            # força do prior empírico agrupado das taxas de ganho/perda
  evidence_warmup: 10            # candidatos OPT avaliados por inteiro antes de usar o histórico
  evidence_mc_samples: 2000      # amostras Monte Carlo para P(Delta_total >= m)
  evidence_batch_size: null      # tamanho do lote sequencial; null = eval_batch_size (200), o que
                                 # com eval_size=45 dá UM lote só (sem rejeição precoce). Ex.: 8
  evidence_seed: 0               # seed do Monte Carlo

  # --- ordenação do treino por Thompson (só tem efeito com curriculum_mode: bayes) ---
  train_order: default           # default (atual) | thompson
  train_reserve_random: 2        # posições aleatórias por lote (thompson)
  no_fixable_action: log         # log (só registra) | simp (dispara SIMP) | stop (encerra) — thompson
  fixable_mass_threshold: 3.0    # ação dispara quando soma de P(erro) dos não irredutíveis < limiar